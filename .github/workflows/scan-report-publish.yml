name: Publish Scan Report

# Scheduled Claude sessions have no GitHub MCP tools, so they cannot open an
# issue directly — but they can push files. This workflow turns a pushed
# report file into a GitHub issue. The issue is opened by github-actions[bot]
# (not the repo owner), so GitHub emails the owner the full report.

# Restricted to the default branch: a report pushed to a feature branch and then
# merged used to fire this twice within seconds, and the dedup search below raced
# itself into publishing duplicate issues. Concurrency serialises runs so the
# dedup check actually sees the issue a previous run created.

on:
  push:
    branches:
      - claude/general-session-4ZGAm
    paths:
      - 'reports/**.md'

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-scan-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Open an issue for each newly added report
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            // Report files added or modified by this push.
            const base = context.payload.before;
            let changed = [];
            try {
              const range = /^0+$/.test(base) ? 'HEAD~1 HEAD' : `${base} ${context.sha}`;
              changed = execSync(`git diff --name-only ${range} -- reports/`, { encoding: 'utf8' })
                .split('\n')
                .filter(f => f.endsWith('.md') && fs.existsSync(f));
            } catch (e) {
              core.warning(`diff failed (${e.message}); falling back to newest report`);
              changed = fs.readdirSync('reports')
                .filter(f => f.endsWith('.md'))
                .sort()
                .slice(-1)
                .map(f => `reports/${f}`);
            }

            if (changed.length === 0) {
              core.info('No report files in this push.');
              return;
            }

            for (const file of changed) {
              const date = (file.match(/(\d{4}-\d{2}-\d{2})/) || [])[1]
                || new Date().toISOString().slice(0, 10);
              const title = `Opportunity Scan — ${date}`;

              // Skip if an issue for this date already exists.
              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
              });
              if (existing.data.total_count > 0) {
                core.info(`Issue already exists for ${date}; skipping.`);
                continue;
              }

              const body = fs.readFileSync(file, 'utf8');
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Opened ${issue.data.html_url}`);
            }

      - name: Ping Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=📊 New Opportunity Scan published: https://github.com/${{ github.repository }}/issues" >/dev/null
          fi
